<script>
  function goToLogin() {
    window.location.href = '../2._login_sign_up/code.html';
  }

  (function() {
    let progress = 64;
    const fillEl = document.getElementById('progress-fill');
    const labelEl = document.getElementById('progress-percent');
    const messageEl = document.getElementById('loading-message');

    const milestones = [
      { at: 75, text: 'Curating DSA practice sets...' },
      { at: 88, text: 'Personalizing interview modules...' },
      { at: 96, text: 'Finalizing readiness tracker...' },
      { at: 100, text: 'Ready for campus drives!' }
    ];

    const timer = setInterval(() => {
      if (progress < 100) {
        progress += 2;
        if (progress > 100) progress = 100;
        if (fillEl) fillEl.style.width = progress + '%';
        if (labelEl) labelEl.textContent = progress + '%';

        const milestone = milestones.find(m => m.at === progress);
        if (milestone && messageEl) {
          messageEl.textContent = milestone.text;
        }
      } else {
        clearInterval(timer);
        setTimeout(goToLogin, 350);
      }
    }, 90);
  })();
